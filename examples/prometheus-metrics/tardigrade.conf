# Example: Prometheus Metrics
#
# Demonstrates: exposing a Prometheus-compatible /status/metrics endpoint so
# that monitoring systems (Prometheus, Grafana Alloy, etc.) can scrape
# server health and request statistics.
#
# What this config does:
#   - Listens on port 8080 (no TLS).
#   - Proxies application traffic to the upstream.
#   - Exposes Prometheus metrics at /status/metrics (the default path).
#   - Optionally requires auth before serving metrics (disabled here for
#     simplicity; see tardigrade.env.example to enable it).
#
# Minimal local setup:
#   TARDIGRADE_CONFIG_PATH=examples/prometheus-metrics/tardigrade.conf \
#   TARDIGRADE_UPSTREAM_BASE_URL=http://127.0.0.1:8081 \
#   ./zig-out/bin/tardi
#
#   curl http://localhost:8080/status/metrics

listen 8080;
server_name localhost;

location = /health {
    return 200 ok;
}

location / {
    proxy_pass /;
}
