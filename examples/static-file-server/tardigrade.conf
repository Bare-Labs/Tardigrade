# Example: Static File Server
#
# Demonstrates: serving static files from a local directory over plain HTTP.
#
# What this config does:
#   - Listens on port 8080 (no TLS).
#   - Serves files from ./public.
#   - Falls back to /index.html for paths that do not map to a file (SPA-friendly).
#   - Returns a 200 health check directly from the edge with no upstream hop.
#
# Minimal local setup:
#   mkdir -p ./public
#   echo '<h1>Hello</h1>' > ./public/index.html
#   TARDIGRADE_CONFIG_PATH=examples/static-file-server/tardigrade.conf ./zig-out/bin/tardi
#   curl http://localhost:8080/

listen 8080;
server_name localhost;

root ./public;
try_files $uri /index.html;

location = /health {
    return 200 ok;
}

location / {
    root ./public;
    try_files $uri /index.html;
}
