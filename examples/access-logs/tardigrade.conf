# Example: Access Logs
#
# Demonstrates: emitting structured JSON access logs for every request, with
# optional filtering by response status and syslog forwarding.
#
# What this config does:
#   - Listens on port 8080 (no TLS).
#   - Proxies all traffic to the upstream.
#   - Emits one JSON log line per request to stdout (the default destination).
#   - Filters out successful health-check noise by setting a minimum log
#     status threshold (TARDIGRADE_ACCESS_LOG_MIN_STATUS=400 means only log
#     4xx and 5xx responses).
#
# Access log settings are controlled by environment variables; see
# tardigrade.env.example for the full list.
#
# Minimal local setup:
#   TARDIGRADE_CONFIG_PATH=examples/access-logs/tardigrade.conf \
#   TARDIGRADE_UPSTREAM_BASE_URL=http://127.0.0.1:8081 \
#   TARDIGRADE_ACCESS_LOG_FORMAT=json \
#   ./zig-out/bin/tardi

listen 8080;
server_name localhost;

location = /health {
    return 200 ok;
}

location / {
    proxy_pass /;
}
