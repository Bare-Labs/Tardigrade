# Example: Production-Hardened Baseline
#
# Demonstrates: a complete, hardened edge deployment suitable for production.
# Combines TLS termination, HSTS, security headers, rate limiting, structured
# access logging, Prometheus metrics, upstream health checks, and graceful
# drain behavior.
#
# All security-sensitive values (cert/key paths, upstream URLs, etc.) are set
# via environment variables so the same config file works across environments.
# See tardigrade.env.example for the complete knob reference.
#
# Minimal local setup:
#   # Generate a self-signed cert for local testing
#   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
#     -keyout /tmp/server.key -out /tmp/server.crt -days 1 -nodes \
#     -subj '/CN=localhost'
#
#   TARDIGRADE_TLS_CERT_PATH=/tmp/server.crt \
#   TARDIGRADE_TLS_KEY_PATH=/tmp/server.key \
#   TARDIGRADE_UPSTREAM_BASE_URL=http://127.0.0.1:8081 \
#   TARDIGRADE_CONFIG_PATH=examples/production-baseline/tardigrade.conf \
#   ./zig-out/bin/tardi

listen 443 ssl;
server_name example.com;

tls_cert_path /etc/tardigrade/tls/fullchain.pem;
tls_key_path /etc/tardigrade/tls/privkey.pem;

# ── Routing ───────────────────────────────────────────────────────────────────

location = /health {
    return 200 ok;
}

location / {
    proxy_pass /;
}
