# Example: Multiple Virtual Hosts / Routes
#
# Demonstrates: routing different hostnames and paths to different upstreams.
#
# What this config does:
#   - Listens on port 8080 (no TLS; add tls_cert_path/tls_key_path per server
#     block for HTTPS).
#   - Two virtual hosts (api.example.com, app.example.com) each with their own
#     document root, upstream, and location rules.
#   - A shared /health liveness endpoint at the global level.
#
# Minimal local setup:
#   TARDIGRADE_CONFIG_PATH=examples/virtual-hosts/tardigrade.conf ./zig-out/bin/tardi
#   curl -H 'Host: api.example.com' http://localhost:8080/health

listen 8080;

# ── Global health check ───────────────────────────────────────────────────────

location = /health {
    return 200 ok;
}

# ── api.example.com ───────────────────────────────────────────────────────────
# Routes /v1/* to an API upstream on loopback port 9001.

server {
    server_name api.example.com;
    upstream_base_url http://127.0.0.1:9001;

    location = /health {
        return 200 ok;
    }

    location /v1/ {
        proxy_pass /v1/;
    }
}

# ── app.example.com ───────────────────────────────────────────────────────────
# Serves a static SPA from /srv/app/public and proxies /api to a different
# upstream on loopback port 9002.

server {
    server_name app.example.com;
    root /srv/app/public;
    try_files $uri /index.html;
    upstream_base_url http://127.0.0.1:9002;

    location = /health {
        return 200 ok;
    }

    location /api/ {
        proxy_pass /api/;
    }

    location / {
        root /srv/app/public;
        try_files $uri /index.html;
    }
}
