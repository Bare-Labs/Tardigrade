# Example: TLS Termination
#
# Demonstrates: terminating HTTPS at the edge and forwarding plain HTTP to an
# upstream application.
#
# What this config does:
#   - Listens on port 443 with TLS (HTTPS).
#   - Terminates TLS using the certificate and key at the configured paths.
#   - Proxies decrypted HTTP to a backend running at http://127.0.0.1:8080.
#   - Exposes /health at the edge (no upstream hop).
#
# Minimal local setup:
#   Replace the cert/key paths below (or set TARDIGRADE_TLS_CERT_PATH and
#   TARDIGRADE_TLS_KEY_PATH as environment variables) with real files, then:
#
#     TARDIGRADE_CONFIG_PATH=examples/tls-termination/tardigrade.conf \
#     TARDIGRADE_UPSTREAM_BASE_URL=http://127.0.0.1:8080 \
#     ./zig-out/bin/tardi
#
#   Self-signed cert for local testing:
#     openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 \
#       -keyout /tmp/server.key -out /tmp/server.crt -days 1 -nodes \
#       -subj '/CN=localhost'
#     TARDIGRADE_TLS_CERT_PATH=/tmp/server.crt \
#     TARDIGRADE_TLS_KEY_PATH=/tmp/server.key \
#     TARDIGRADE_CONFIG_PATH=examples/tls-termination/tardigrade.conf \
#     ./zig-out/bin/tardi

listen 443 ssl;
server_name example.com;

tls_cert_path /etc/tardigrade/tls/fullchain.pem;
tls_key_path /etc/tardigrade/tls/privkey.pem;

location = /health {
    return 200 ok;
}

location / {
    proxy_pass /;
}
