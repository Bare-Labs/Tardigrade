# Example: Rate Limiting
#
# Demonstrates: capping the request rate per client identity to protect
# upstream services from traffic spikes and abusive clients.
#
# What this config does:
#   - Listens on port 8080 (no TLS).
#   - Proxies all traffic to the upstream.
#   - Rate limits all clients to 60 requests per second with a burst of 20
#     (set via environment variables; see tardigrade.env.example).
#   - Clients that exceed the limit receive 429 Too Many Requests.
#
# Rate-limit keying:
#   - Authenticated clients (JWT or bearer token): keyed on identity.
#   - Unauthenticated clients: keyed on IP address.
#
# Minimal local setup:
#   TARDIGRADE_CONFIG_PATH=examples/rate-limiting/tardigrade.conf \
#   TARDIGRADE_UPSTREAM_BASE_URL=http://127.0.0.1:8081 \
#   TARDIGRADE_RATE_LIMIT_RPS=60 \
#   TARDIGRADE_RATE_LIMIT_BURST=20 \
#   ./zig-out/bin/tardi

listen 8080;
server_name localhost;

location = /health {
    return 200 ok;
}

location / {
    proxy_pass /;
}
