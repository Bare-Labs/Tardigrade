# Example: Upstream Health Checks
#
# Demonstrates: active health checking so Tardigrade automatically avoids
# backends that are not responding.
#
# What this config does:
#   - Listens on port 8080 (no TLS).
#   - Proxies to multiple upstream replicas (pool).
#   - Enables active health checking: Tardigrade probes /health on each
#     upstream at a regular interval and removes failing backends from
#     rotation until they recover.
#
# Health check settings are controlled by environment variables; see
# tardigrade.env.example for the full list.
#
# Minimal local setup:
#   Start one or more backends on ports 3001 and 3002, then:
#     TARDIGRADE_CONFIG_PATH=examples/health-checks/tardigrade.conf \
#     TARDIGRADE_UPSTREAM_BASE_URLS=http://127.0.0.1:3001,http://127.0.0.1:3002 \
#     TARDIGRADE_UPSTREAM_ACTIVE_HEALTH_PATH=/health \
#     ./zig-out/bin/tardi

listen 8080;
server_name localhost;

location = /health {
    return 200 ok;
}

location / {
    proxy_pass /;
}
