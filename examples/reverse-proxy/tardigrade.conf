# Example: Reverse Proxy to a Local App
#
# Demonstrates: forwarding all requests to an upstream application server.
#
# What this config does:
#   - Listens on port 8080 (no TLS).
#   - Proxies all traffic to a backend app running at http://127.0.0.1:3000.
#   - Exposes a /health liveness check that is served directly from the edge.
#   - Strips the /api prefix before forwarding to the upstream (prefix routing).
#
# Minimal local setup:
#   Start any HTTP server on port 3000, for example:
#     python3 -m http.server 3000
#   Then:
#     TARDIGRADE_CONFIG_PATH=examples/reverse-proxy/tardigrade.conf \
#     TARDIGRADE_UPSTREAM_BASE_URL=http://127.0.0.1:3000 \
#     ./zig-out/bin/tardi
#     curl http://localhost:8080/

listen 8080;
server_name localhost;

location = /health {
    return 200 ok;
}

location /api/ {
    proxy_pass /api/;
}

location / {
    proxy_pass /;
}
