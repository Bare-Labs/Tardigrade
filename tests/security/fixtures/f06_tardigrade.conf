# Synthetic edge topology for the #673 live F-06 campaign.
# Disposable, local-only: synthetic bearer/JWT secrets, one protected route,
# one deliberately hostile-upstream route, and a static root used for the
# traversal boundary checks. Never point this at production.
#
# Started by scripts/run-f06-auth-framing-campaign.sh with:
#   TARDIGRADE_UPSTREAM_BASE_URL, TARDIGRADE_AUTH_TOKEN_HASHES,
#   TARDIGRADE_JWT_SECRET set via environment.

listen 18089;
server_name localhost;

root tests/security/fixtures/f06_static_root;
index index.html;

location = /health {
    return 200 ok;
}

location = /protected {
    proxy_pass /protected;
    auth required;
}

location /protected/ {
    proxy_pass /protected/;
    auth required;
}

location = /hostile {
    proxy_pass /hostile;
}

location /hostile/ {
    proxy_pass /hostile/;
}

# Forced-streaming twin of /hostile (#673 review): the buffered proxy path
# fully materializes the upstream response before deciding anything, but
# the streaming path (streamProxyOverTransport/readUpstreamHead in
# gateway_proxy.zig) has its own, separately-fixed copies of the same
# framing/reuse/1xx logic. Streaming is off by default, so a campaign that
# only ever hits /hostile exercises the buffered path alone. This location
# forces proxy_streaming so the SAME hostile upstream scenarios can be
# replayed against the streaming code path too.
location = /hostile-streaming {
    proxy_pass /hostile;
    proxy_streaming response;
}

# Unauthenticated proxied sink for smuggling-marker probes (#673 review):
# every smuggling oracle in f06_live_campaign.py sends a unique
# `GET /f06-marker-<case>` as its "apparent follow-up request". Without a
# matching proxy_pass location here, a request that WAS wrongly dispatched
# would just 404 out of the static catch-all and never reach the recording
# upstream, making the marker-absence assertion vacuously true regardless
# of whether desynchronization actually happened.
location /f06-marker- {
    proxy_pass /f06-marker-;
}

location /alias/ {
    alias tests/security/fixtures/f06_alias_root/;
}

location / {
    root tests/security/fixtures/f06_static_root;
}
