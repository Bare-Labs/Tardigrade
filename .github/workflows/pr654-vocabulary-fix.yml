# One-shot helper: applies the final #649 vocabulary cleanup, then deletes itself.
name: PR 654 vocabulary cleanup

on:
  push:
    branches:
      - claude/issue-649-implementation-cd6117

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: claude/issue-649-implementation-cd6117
          persist-credentials: true

      - name: Apply exact vocabulary cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s) of {old!r}, found {found}")
              p.write_text(text.replace(old, new))

          replace("docs/UPSTREAM_POOLING.md", "src/http/tls_termination.zig", "src/http/upstream_tls.zig")
          replace("src/http/upstream_pool.zig", "entry owns the OpenSSL connection;", "entry owns the native `UpstreamTlsConn`;")
          replace("src/http/upstream_pool.zig", "`tls` holds the heap-owned OpenSSL connection (allocated with the pool's", "`tls` holds the heap-owned native `UpstreamTlsConn` (allocated with the pool's")

          replace(
              "src/http/upstream_h2.zig",
              "//! `read([]u8) !usize`, `writeAll([]const u8) !void`, and `pending() usize`\n//! (`SSL_pending`, so poll-bounded reads do not miss data already buffered in\n//! OpenSSL). Reads are bounded with `poll(2)` so a hung origin cannot block a\n//! worker indefinitely (the #196 guarantee).",
              "//! `read([]u8) !usize`, `writeAll([]const u8) !void`, and `pending() usize`.\n//! `pending()` reports already-decrypted plaintext buffered by the transport,\n//! so poll-bounded reads do not miss bytes already available above the socket.\n//! Reads are bounded with `poll(2)` so a hung origin cannot block a worker\n//! indefinitely (the #196 guarantee).",
          )

          replace(
              "src/edge_config.zig",
              "/// (#392). Required (and strictly validated) in the appliance TLS profile;\n    /// unused by the general OpenSSL terminator.",
              "/// (#392). Required (and strictly validated) in the appliance TLS profile;\n    /// not used by the general profile.",
          )
          replace(
              "src/edge_config.zig",
              "/// Deliberately distinct from the `tls_session_*`/`tls_session_tickets_*`\n    /// fields above, which remain OpenSSL-facing only — native settings\n    /// affect only the native TLS-over-TCP and QUIC/H3 engines and must\n    /// never be conflated with the OpenSSL terminator's own session config.",
              "/// Deliberately distinct from the `tls_session_*`/`tls_session_tickets_*`\n    /// fields above, which are retired legacy knobs rejected by native builds.\n    /// These settings configure the native TLS-over-TCP and QUIC/H3 engines and\n    /// remain separate from those unsupported compatibility fields.",
          )

          replace("src/edge_gateway.zig", "// HTTP, OpenSSL-only, resumption-disabled, or replay-mode-disabled", "// HTTP, no-native-TLS-path, resumption-disabled, or replay-mode-disabled")
          replace("src/edge_gateway.zig", "/// sufficient — a native (non-OpenSSL) TLS backend that could ever accept", "/// sufficient — a native TLS path that could ever accept")
          replace(
              "src/edge_gateway.zig",
              "/// The OpenSSL terminator owns its own independent session cache and never\n/// consults this seam at all, so plain HTTP, OpenSSL-only, or\n/// resumption-disabled deployments must never gain the configured-entry\n/// allocation or a new startup-failure path for a security feature they\n/// cannot use.",
              "/// Plain HTTP or configurations without a native TLS/QUIC credential path do\n/// not consult this seam, so those and resumption-disabled deployments must\n/// never gain the configured-entry allocation or a new startup-failure path\n/// for a security feature they cannot use.",
          )
          replace(
              "src/edge_gateway.zig",
              "/// never construct a store, even when a native path exists, so plain HTTP,\n/// OpenSSL-only, resumption-disabled, or explicitly opted-out deployments",
              "/// never construct a store, even when a native path exists, so plain HTTP,\n/// no-native-TLS-path, resumption-disabled, or explicitly opted-out deployments",
          )
          replace(
              "src/edge_gateway.zig",
              "// OpenSSL-only TCP with HTTP/3 disabled: native resumption enabled, but\n    // neither a native TCP provider nor an eligible H3 path exists.",
              "// No native TCP credential provider and HTTP/3 disabled: resumption may be\n    // enabled in config, but no native PSK/early-data path can exist.",
          )

          replace("src/http/negotiated_dispatch.zig", 'test "shared runtime dispatch accepts OpenSSL-shaped and EncryptedStream connection shapes" {', 'test "shared runtime dispatch accepts generic and EncryptedStream connection shapes" {')
          replace("src/http/negotiated_dispatch.zig", "TestOpenSslConn", "TestGenericConn", expected=5)
          replace("src/http/negotiated_dispatch.zig", "openssl_conn", "generic_conn", expected=3)

          checks = {
              "docs/UPSTREAM_POOLING.md": ["src/http/tls_termination.zig"],
              "src/http/upstream_pool.zig": ["owns the OpenSSL connection", "heap-owned OpenSSL connection"],
              "src/http/upstream_h2.zig": ["SSL_pending", "buffered in OpenSSL"],
              "src/edge_config.zig": ["general OpenSSL terminator", "remain OpenSSL-facing only", "OpenSSL terminator's own session config"],
              "src/edge_gateway.zig": ["OpenSSL-only", "native (non-OpenSSL) TLS backend", "The OpenSSL terminator owns"],
              "src/http/negotiated_dispatch.zig": ["OpenSSL-shaped", "TestOpenSslConn", "openssl_conn"],
          }
          for path, needles in checks.items():
              text = Path(path).read_text()
              for needle in needles:
                  if needle in text:
                      raise SystemExit(f"{path}: stale vocabulary remains: {needle!r}")
          PY

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr654-vocabulary-fix.yml
          git add docs/UPSTREAM_POOLING.md src/http/upstream_pool.zig src/http/upstream_h2.zig src/edge_config.zig src/edge_gateway.zig src/http/negotiated_dispatch.zig
          git diff --cached --check
          git commit -m "review: finish native TLS vocabulary cleanup"
          git push origin HEAD:claude/issue-649-implementation-cd6117
