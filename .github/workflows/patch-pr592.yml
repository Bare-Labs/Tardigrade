name: Patch PR 592

on:
  push:
    branches:
      - claude/issue-139-implementation-480e10
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Apply reviewed fixes and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${TARGET_SHA}"
          git checkout --detach FETCH_HEAD

          python3 -c 'from pathlib import Path; p=Path("src/http/upstream_h2.zig"); s=p.read_text(); old="                if (stream.err) |e| {\n                    self.state_mutex.unlock();\n                    return e;\n                }\n                if (self.conn_err) |e| {\n                    self.state_mutex.unlock();\n                    return e;\n                }\n                if (stream.done) {\n                    self.state_mutex.unlock();\n                    return 0;\n                }\n"; new="                if (stream.err) |e| {\n                    self.state_mutex.unlock();\n                    return e;\n                }\n                // END_STREAM makes this response complete even if the peer\n                // closes the shared connection immediately afterward.\n                if (stream.done) {\n                    self.state_mutex.unlock();\n                    return 0;\n                }\n                if (self.conn_err) |e| {\n                    self.state_mutex.unlock();\n                    return e;\n                }\n"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          python3 -c 'from pathlib import Path; p=Path("src/http/upstream_h2.zig"); s=p.read_text(); old="            while (it.next()) |sp| {\n                if (sp.*.err == null) sp.*.err = e;\n                sp.*.cond.signal(); // wake each response waiter\n            }\n"; new="            while (it.next()) |sp| {\n                // A connection failure cannot retroactively invalidate a\n                // response whose END_STREAM was already processed.\n                if (!sp.*.done and sp.*.err == null) sp.*.err = e;\n                sp.*.cond.signal(); // wake each response waiter\n            }\n"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          python3 -c "from pathlib import Path; p=Path('tests/integration.zig'); s=p.read_text(); old='test \"proxy streaming mode streams from an upstream requiring a client certificate\" {\n    const allocator = std.testing.allocator;\n    try requireOpenssl(allocator);\n'; new='test \"proxy streaming mode streams from an upstream requiring a client certificate\" {\n    const allocator = std.testing.allocator;\n    try requireGeneralTlsProfile();\n    try requireOpenssl(allocator);\n'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))"

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/http/upstream_h2.zig tests/integration.zig
          if git diff --cached --quiet; then
            echo "No changes produced" >&2
            exit 1
          fi
          git commit -m "fix(proxy): preserve completed h2 streams"
          git push origin "HEAD:${TARGET_REF}"
